      <!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠遊戲</title>
  <style>
body {font-family:Arial,sans-serif;background:linear-gradient(#7ec850,#4fa63a);text-align:center;padding:20px;}
h1{color:#fff;text-shadow:2px 2px 4px #000}
#score,#highScore{font-size:24px;color:#fff;margin-bottom:10px}
#game{width:330px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.hole{width:100px;height:100px;background:#3e2a14;border-radius:50%;box-shadow:inset 0 10px 20px rgba(0,0,0,.6);position:relative;overflow:hidden}
.mole{width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#c68642,#7a4a1f);border-radius:50%;position:absolute;bottom:-80px;left:50%;transform:translateX(-50%);transition:.15s;box-shadow:0 6px 0 rgba(0,0,0,.25), inset -4px -6px 0 rgba(0,0,0,.15);}
.mole::before{content:"";position:absolute;width:14px;height:14px;background:#111;border-radius:50%;left:16px;top:22px;box-shadow:2px 2px 0 rgba(255,255,255,.2);}
.mole::after{content:"";position:absolute;width:14px;height:14px;background:#111;border-radius:50%;right:16px;top:22px;box-shadow:2px 2px 0 rgba(255,255,255,.2);}
.mole .nose{position:absolute;width:14px;height:10px;background:linear-gradient(#ffb7c5,#ff8fa3);border-radius:50%;left:50%;top:44px;transform:translateX(-50%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);}
.mole.show{bottom:10px}
button{margin-top:20px;padding:12px 25px;font-size:18px;border:none;border-radius:8px;background:#ffb703;box-shadow:0 4px #c57f00;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px #c57f00}
#gameOverScreen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);color:#fff;align-items:center;justify-content:center;z-index:1000}
</style>
</head>
<body>
  <h1>打地鼠遊戲</h1>
  <div id="score">分數：0</div>
  <div id="highScore">最高分：0</div>
  <div id="game">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>
  <button id="startBtn">開始遊戲 / 重置</button>
  <div id="gameOverScreen">
    <div style="background:#222; padding:30px 40px; border-radius:12px; text-align:center;">
      <h2>遊戲結束</h2>
      <p id="finalScore">你的分數：0</p>
      <button id="restartBtn" style="margin-top:15px; padding:10px 20px; font-size:16px;">重新開始</button>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const highScoreDisplay = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const gameOverScreen = document.getElementById('gameOverScreen');

    let score = 0;
    let phase = 1;
    let gameRunning = false;
    let visibleMoles = 0;
    let gameInterval = null;

    // 使用 localStorage 儲存最高分
    let highScore = localStorage.getItem('whackAMoleHighScore') ? parseInt(localStorage.getItem('whackAMoleHighScore')) : 0;
    highScoreDisplay.textContent = `最高分：${highScore}`;

    const speedPhase1 = 350;
    const speedPhase2 = 250;
    const speedPhase3 = 200;

    function updateSpeed() {
      if (score < 500) return speedPhase1;
      if (score < 1500) return speedPhase2;
      return speedPhase3;
    }

    function updatePhase() {
      if (score < 500) phase = 1;
      else if (score < 1500) phase = 2;
      else phase = 3;
    }

    function popRandomMole() {
      if (!gameRunning) return;
      if (visibleMoles >= 4) { endGame(); return; }
      const idx = Math.floor(Math.random() * moles.length);
      const mole = moles[idx];
      if (!mole.classList.contains('show')) { mole.classList.add('show'); visibleMoles++; }
    }

    moles.forEach(mole => {
      mole.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!gameRunning) return;
        if (mole.classList.contains('show')) {
          mole.classList.remove('show');
          visibleMoles = Math.max(0, visibleMoles - 1);
          if (phase === 1) score += 5;
          else if (phase === 2) score += 10;
          else score += 20;
          scoreDisplay.textContent = `分數：${score}`;
          updatePhase();
          clearInterval(gameInterval);
          gameInterval = setInterval(popRandomMole, updateSpeed());
        }
      });
    });

    document.getElementById('game').addEventListener('click', (e) => {
      e.stopPropagation();
    });

    function endGame() {
      clearInterval(gameInterval);
      gameRunning = false;
      visibleMoles = 0;
      moles.forEach(m => m.classList.remove('show'));
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = `最高分：${highScore}`;
        localStorage.setItem('whackAMoleHighScore', highScore);
      }
      document.getElementById('finalScore').textContent = `你的分數：${score}`;
      gameOverScreen.style.display = 'flex';
    }

    restartBtn.addEventListener('click', () => {
      gameOverScreen.style.display = 'none';
      score = 0;
      phase = 1;
      scoreDisplay.textContent = `分數：${score}`;
    });

    startBtn.addEventListener('click', () => {
      clearInterval(gameInterval);
      score = 0;
      phase = 1;
      visibleMoles = 0;
      scoreDisplay.textContent = `分數：${score}`;
      moles.forEach(m => m.classList.remove('show'));
      gameRunning = true;
      gameInterval = setInterval(popRandomMole, updateSpeed());
    });
  });
  </script>
</body>
</html>
