<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠遊戲</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #score {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #game {
      width: 330px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .hole {
      width: 100px;
      height: 100px;
      background: #d9d9d9;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .mole {
      width: 80px;
      height: 80px;
      background: brown;
      border-radius: 50%;
      position: absolute;
      bottom: -90px;
      left: 50%;
      transform: translateX(-50%);
      transition: bottom 0.1s;
    }

    .mole.show {
      bottom: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>打地鼠遊戲</h1>
  <div id="score">分數：0</div>

  <div id="game">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>

  <button id="startBtn">開始遊戲 / 重置</button>

  <script>
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let phase = 1;
    let gameRunning = false;
    let gameInterval = null;

    // 速度設定
    const speedPhase1 = 400;
    const speedPhase2 = 300;
    const speedPhase3 = 200;

    function updateSpeed() {
      if (score < 500) return speedPhase1;
      if (score < 1500) return speedPhase2;
      return speedPhase3;
    }

    function updatePhase() {
      if (score < 500) phase = 1;
      else if (score < 1500) phase = 2;
      else phase = 3;
    }

    function popRandomMole() {
      const idx = Math.floor(Math.random() * moles.length);
      const mole = moles[idx];
      mole.classList.add('show');
    }

    moles.forEach(mole => {
      mole.addEventListener('click', () => {
        if (mole.classList.contains('show')) {
          mole.classList.remove('show');

          if (phase === 1) score += 5;
          else if (phase === 2) score += 10;
          else score += 20;

          scoreDisplay.textContent = `分數：${score}`;
          updatePhase();

          // 移除自動重啟，不清除 gameInterval
          // 重新設定 interval 讓速度能加快
          clearInterval(gameInterval);
          gameInterval = setInterval(popRandomMole, updateSpeed());
        }
      });
    });

    startBtn.addEventListener('click', () => {
      clearInterval(gameInterval);
      score = 0;
      phase = 1;
      scoreDisplay.textContent = `分數：${score}`;

      moles.forEach(m => m.classList.remove('show'));

      gameRunning = true;
      gameInterval = setInterval(popRandomMole, updateSpeed());
    });
  </script>
</body>
</html>
