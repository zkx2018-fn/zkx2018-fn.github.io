<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠遊戲</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; text-align: center; padding: 20px; }
    h1 { margin-bottom: 10px; }
    #score, #highScore { font-size: 24px; margin-bottom: 20px; }
    #game { width: 330px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .hole { width: 100px; height: 100px; background: #d9d9d9; border-radius: 10px; position: relative; overflow: hidden; cursor: pointer; }
    .mole { width: 80px; height: 80px; background: brown; border-radius: 50%; position: absolute; bottom: -90px; left: 50%; transform: translateX(-50%); transition: bottom 0.1s; }
    .mole.show { bottom: 5px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
    #gameOverScreen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); color: #fff; align-items: center; justify-content: center; z-index: 1000; }
  </style>
</head>
<body>
  <h1>打地鼠遊戲</h1>
  <div id="score">分數：0</div>
  <div id="highScore">最高分：0</div>
  <div id="game">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>
  <button id="startBtn">開始遊戲 / 重置</button>
  <div id="gameOverScreen">
    <div style="background:#222; padding:30px 40px; border-radius:12px; text-align:center;">
      <h2>遊戲結束</h2>
      <p id="finalScore">你的分數：0</p>
      <button id="restartBtn" style="margin-top:15px; padding:10px 20px; font-size:16px;">重新開始</button>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const highScoreDisplay = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const gameOverScreen = document.getElementById('gameOverScreen');

    let score = 0;
    let phase = 1;
    let gameRunning = false;
    let visibleMoles = 0;
    let gameInterval = null;

    // 使用 localStorage 儲存最高分
    let highScore = localStorage.getItem('whackAMoleHighScore') ? parseInt(localStorage.getItem('whackAMoleHighScore')) : 0;
    highScoreDisplay.textContent = `最高分：${highScore}`;

    const speedPhase1 = 350;
    const speedPhase2 = 250;
    const speedPhase3 = 200;

    function updateSpeed() {
      if (score < 500) return speedPhase1;
      if (score < 1500) return speedPhase2;
      return speedPhase3;
    }

    function updatePhase() {
      if (score < 500) phase = 1;
      else if (score < 1500) phase = 2;
      else phase = 3;
    }

    function popRandomMole() {
      if (!gameRunning) return;
      if (visibleMoles >= 4) { endGame(); return; }
      const idx = Math.floor(Math.random() * moles.length);
      const mole = moles[idx];
      if (!mole.classList.contains('show')) { mole.classList.add('show'); visibleMoles++; }
    }

    moles.forEach(mole => {
      mole.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!gameRunning) return;
        if (mole.classList.contains('show')) {
          mole.classList.remove('show');
          visibleMoles = Math.max(0, visibleMoles - 1);
          if (phase === 1) score += 5;
          else if (phase === 2) score += 10;
          else score += 20;
          scoreDisplay.textContent = `分數：${score}`;
          updatePhase();
          clearInterval(gameInterval);
          gameInterval = setInterval(popRandomMole, updateSpeed());
        }
      });
    });

    document.getElementById('game').addEventListener('click', (e) => {
      e.stopPropagation();
    });

    function endGame() {
      clearInterval(gameInterval);
      gameRunning = false;
      visibleMoles = 0;
      moles.forEach(m => m.classList.remove('show'));
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = `最高分：${highScore}`;
        localStorage.setItem('whackAMoleHighScore', highScore);
      }
      document.getElementById('finalScore').textContent = `你的分數：${score}`;
      gameOverScreen.style.display = 'flex';
    }

    restartBtn.addEventListener('click', () => {
      gameOverScreen.style.display = 'none';
      score = 0;
      phase = 1;
      scoreDisplay.textContent = `分數：${score}`;
    });

    startBtn.addEventListener('click', () => {
      clearInterval(gameInterval);
      score = 0;
      phase = 1;
      visibleMoles = 0;
      scoreDisplay.textContent = `分數：${score}`;
      moles.forEach(m => m.classList.remove('show'));
      gameRunning = true;
      gameInterval = setInterval(popRandomMole, updateSpeed());
    });
  });
  </script>
</body>
</html>
